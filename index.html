<style>
/* Layout: barra de filtros fixa no topo, abas por nível (Resumo > Praças > Gestores > Lojas > Consultores > Comentários), tabelas ordenáveis com drill-down por clique */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --ink:#14201F; --ink2:#4A5B59; --ink3:#7A8B89; --line:#DCE4E3; --line2:#EDF2F1;
  --accent:#0E6F63; --accent-soft:#DFF0EC; --accent-ink:#FFFFFF;
  --bad:#B3261E; --bad-soft:#FBE8E6; --warn:#8F5A00; --warn-soft:#FFF0D2; --good:#1B7A3E; --good-soft:#E1F3E7;
  --s2:#3B5BA5; --neutral-soft:#E9EEED;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --bad:#FF8F85; --bad-soft:#3B1F1D; --warn:#F2BC55; --warn-soft:#38300F; --good:#74D493; --good-soft:#16301F;
  --s2:#8FA9EA; --neutral-soft:#1F2E2C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --ink:#E6EFEE; --ink2:#A3B6B3; --ink3:#78908C; --line:#2B3B39; --line2:#213130;
  --accent:#4FC3B1; --accent-soft:#17352F; --accent-ink:#0B1A18;
  --bad:#FF8F85; --bad-soft:#3B1F1D; --warn:#F2BC55; --warn-soft:#38300F; --good:#74D493; --good-soft:#16301F;
  --s2:#8FA9EA; --neutral-soft:#1F2E2C; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
*{box-sizing:border-box}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-disp);margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top{padding-block:20px 14px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
header.top h1{font-size:26px;line-height:1.1}
header.top p{margin:4px 0 0;color:var(--ink2);font-size:13px;max-width:70ch}
.metaTag{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.frow{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px;min-width:0}
.fg>label,.fg>span.l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:150px;max-width:260px}
select:focus-visible,input:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink2);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ink2);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:0}
.crumb{background:var(--neutral-soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.crumb button{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;border-radius:50%}
main{margin-top:16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:17px;margin-bottom:2px}
.card .sub{color:var(--ink3);font-size:12px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.kpi .v{font-family:var(--f-disp);font-size:32px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:4px}
.kpi.hero{border-color:var(--accent)}
.neg{color:var(--bad)}.pos{color:var(--good)}.warnc{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.read{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.read li{padding-left:14px;position:relative}
.read li:before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child,th.tl,td.tl{text-align:left}
thead th{position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
thead th[aria-sort]{color:var(--accent)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
td.name{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
td .sm{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-low{background:var(--neutral-soft);color:var(--ink3)}
.gapbar{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;width:100%}
.gapbar i{display:inline-block;height:8px;border-radius:4px;min-width:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;justify-content:space-between}
.tools .l{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--ink3)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start;min-width:0}
.pc header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc h3{font-size:16px}
.bar{display:grid;grid-template-columns:minmax(90px,1.1fr) 3fr auto;gap:8px;align-items:center;font-size:12px}
.bar .t{height:8px;background:var(--line2);border-radius:4px;position:relative}
.bar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--bad)}
.bar b{font-variant-numeric:tabular-nums;font-weight:600}
.cm{border-top:1px solid var(--line2);padding:10px 0;display:grid;gap:4px}
.cm .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.nota{display:inline-block;min-width:26px;text-align:center;padding:1px 6px;border-radius:6px;font-weight:700;font-size:12px}
.tag{font-size:11px;background:var(--neutral-soft);color:var(--ink2);border-radius:999px;padding:1px 8px}
.cm p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:260px;display:none;line-height:1.35}
svg text{font-family:var(--f-body);fill:var(--ink2);font-size:11px}
svg .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details.how{font-size:13px;color:var(--ink2)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how code{background:var(--neutral-soft);padding:1px 6px;border-radius:5px}
@media (max-width:600px){header.top h1{font-size:22px}.kpi .v{font-size:26px}select,input[type=search]{min-width:130px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
const fi=x=>Math.round(x).toLocaleString('pt-BR');
const sg=x=>(x>0?'+':x<0?'−':'')+f1(Math.abs(x));

/* ---------- núcleo de cálculo ---------- */
function met(P,N,Dt){
  const n=P+N+Dt, net=P-Dt, nps=n?net/n*100:0, gap=nps-D.meta, short=T*n-net;
  return {n,P,N,D:Dt,nps,gap,
    rev:short>0?Math.ceil(short/2):0,            // detratores que precisam virar promotores
    need:short>0?Math.ceil(short/(1-T)):0,        // novas respostas promotoras (9-10) necessárias
    cush:short<0?Math.floor(-short/(1+T)):0};     // detratores novos que a loja ainda suportaria
}
function agg(arr){let P=0,N=0,Dt=0;for(const r of arr){const k=r[3];if(k===0)P++;else if(k===1)N++;else Dt++}return met(P,N,Dt)}
function sel(skip={}){
  return R.filter(r=>{
    const s=S[r[0]];
    if(!skip.m&&!st.meses.has(r[1]))return false;
    if(!skip.canal&&!CAN[st.canal].includes(r[2]))return false;
    if(!skip.praca&&st.praca&&s.praca!==st.praca)return false;
    if(!skip.gvo&&st.gvo&&s.gvo!==st.gvo)return false;
    if(!skip.loja&&st.loja>=0&&r[0]!==st.loja)return false;
    if(!skip.cons&&st.cons>=0&&r[4]!==st.cons)return false;
    return true;});
}
function groupBy(arr,keyf){const m=new Map();for(const r of arr){const k=keyf(r);let g=m.get(k);if(!g){g=[0,0,0,[]];m.set(k,g)}g[r[3]]++;}return m}
function status(m,minN){
  if(m.n<minN)return ['p-low','Amostra baixa','Menos de '+minN+' respostas: leia com cautela'];
  if(m.nps>=D.meta)return ['p-good','Na meta','Folga: aguenta mais '+m.cush+' detrator(es) sem sair da meta'];
  if(m.gap>=-3)return ['p-warn','Atenção','Até 3 p.p. abaixo da meta'];
  return ['p-bad','Crítico','Mais de 3 p.p. abaixo da meta'];
}

/* ---------- tabelas ---------- */
function gapCell(m){
  const w=Math.min(60,Math.abs(m.gap)*10);
  return `<span class="gapbar"><span class="${m.gap<0?'neg':'pos'}">${sg(m.gap)}</span><i style="width:${w}px;background:var(--${m.gap<0?'bad':'good'})"></i></span>`;
}
function tableHTML(id,cols,rows,onclickKey){
  const so=st.sort[id]||{k:'need',d:-1};
  const sorted=rows.slice().sort((a,b)=>{const x=a[so.k],y=b[so.k];
    if(typeof x==='string')return so.d*x.localeCompare(y,'pt');
    if(y===x&&so.k!=='need')return b.need-a.need;return so.d*((x>y)-(x<y))||(b.n-a.n)});
  const th=cols.map(c=>`<th class="${c.l?'tl':''}" data-k="${c.k}" ${so.k===c.k?`aria-sort="${so.d<0?'descending':'ascending'}"`:''} ${c.tip?`data-tip="${esc(c.tip)}"`:''}>${c.h}${so.k===c.k?(so.d<0?' ↓':' ↑'):''}</th>`).join('');
  const tr=sorted.map(r=>`<tr class="${onclickKey?'click':''}" ${onclickKey?`data-id="${r.id}" tabindex="0"`:''}>${cols.map(c=>`<td class="${c.l?'tl':''} ${c.k==='name'?'name':''}">${c.f?c.f(r):r[c.k]}</td>`).join('')}</tr>`).join('');
  return `<div class="tw"><table data-tbl="${id}"><thead><tr>${th}</tr></thead><tbody>${tr||`<tr><td colspan="${cols.length}" class="tl">Sem dados para os filtros atuais.</td></tr>`}</tbody></table></div>`;
}
function baseCols(minN){
  return [
    {k:'n',h:'Respostas',f:r=>fi(r.n)},
    {k:'P',h:'Prom.',f:r=>fi(r.P),tip:'Notas 9 e 10'},
    {k:'N',h:'Neut.',f:r=>fi(r.N),tip:'Notas 7 e 8'},
    {k:'D',h:'Detr.',f:r=>fi(r.D),tip:'Notas 0 a 6'},
    {k:'nps',h:'NPS',f:r=>`<b>${f1(r.nps)}</b>`},
    {k:'gap',h:'Gap vs 91',f:r=>gapCell(r),tip:'NPS − meta, em pontos percentuais'},
    {k:'rev',h:'Detr. a reverter',f:r=>r.rev?fi(r.rev)+(r.rev>r.D?'*':''):'—',tip:'Detratores que precisam virar promotores para bater a meta. * = mesmo revertendo todos os detratores não basta'},
    {k:'need',h:'Prom. novos p/ meta',f:r=>r.need?fi(r.need):'—',tip:'Respostas 9-10 adicionais (mantendo o resto igual) para chegar a 91%'},
    {k:'stt',h:'Status',f:r=>{const s=status(r,minN);return `<span class="pill ${s[0]}" data-tip="${esc(s[2])}">${s[1]}</span>`}}
  ];
}
function decorate(rows,minN){rows.forEach(r=>{r.stt=status(r,minN)[1]});return rows}
function bindTable(id,handler){
  const t=document.querySelector(`table[data-tbl="${id}"]`);if(!t)return;
  t.querySelector('thead').onclick=e=>{const h=e.target.closest('th');if(!h)return;const k=h.dataset.k;
    const cur=st.sort[id]||{k:'need',d:-1};st.sort[id]={k,d:cur.k===k?-cur.d:(k==='name'?1:-1)};render()};
  if(handler){const go=e=>{const r=e.target.closest('tr[data-id]');if(r)handler(r.dataset.id)};
    t.querySelector('tbody').onclick=go;t.querySelector('tbody').onkeydown=e=>{if(e.key==='Enter')go(e)}}

function copyTable(id){
  const t=document.querySelector(`table[data-tbl="${id}"]`);if(!t)return;
  const tx=[...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
  const b=$('btnCopy');
  const ok=()=>{b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar tabela',1500)};
  try{navigator.clipboard.writeText(tx).then(ok,()=>{b.textContent='Selecione e copie a tabela manualmente'})}catch(e){b.textContent='Selecione e copie a tabela manualmente'}
}
function tools(id,extra=''){
  return `<div class="tools"><div class="l">${extra}</div><button class="btn" id="btnCopy">Copiar tabela</button></div>`;
}

/* ---------- gráficos ---------- */
function trendSVG(){
  const rows=M.map((m,i)=>{const a=sel({m:true}).filter(r=>r[1]===i);return {m,...agg(a)}}).filter(x=>x.n>0);
  if(rows.length<2)return '<p class="note">Dados insuficientes para a tendência.</p>';
  const W=640,H=230,L=52,Rr=16,Tp=14,B=28;
  const vals=rows.map(r=>r.nps).concat([D.meta]);
  let lo=Math.floor(Math.min(...vals)-2),hi=Math.ceil(Math.max(...vals)+2);
  const x=i=>L+14+(W-L-Rr-28)*i/(rows.length-1), y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let g='';const step=(hi-lo)>12?4:2;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const pts=rows.map((r,i)=>`${x(i)},${y(r.nps)}`).join(' ');
  const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.nps)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(i)}" y="${y(r.nps)-9}" text-anchor="middle" style="fill:var(--ink)">${f1(r.nps)}</text>
    <text x="${x(i)}" y="${H-8}" text-anchor="middle">${ml(r.m)}</text>
    <rect x="${x(i)-22}" y="${Tp}" width="44" height="${H-Tp-B}" fill="transparent" data-tip="${ml(r.m)}: NPS ${f1(r.nps)} · ${fi(r.n)} respostas · gap ${sg(r.gap)} p.p."/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="NPS por mês versus meta de 91">${g}
    <line x1="${L}" x2="${W-Rr}" y1="${y(D.meta)}" y2="${y(D.meta)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-Rr}" y="${y(D.meta)-5}" text-anchor="end" style="fill:var(--bad);font-weight:600">Meta 91</text>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}
function pracaBarsSVG(){
  const a=sel({praca:true,gvo:true,loja:true,cons:true});
  const g=groupBy(a,r=>S[r[0]].praca);
  const rows=[...g.entries()].map(([k,v])=>({k,...met(v[0],v[1],v[2])})).sort((p,q)=>p.nps-q.nps);
  const lo=Math.floor(Math.min(...rows.map(r=>r.nps),D.meta)-1),hi=Math.ceil(Math.max(...rows.map(r=>r.nps),D.meta)+1);
  const W=640,L=84,Rr=60,rh=26,H=rows.length*rh+30,x=v=>L+(W-L-Rr)*(v-lo)/(hi-lo);
  let s='';
  rows.forEach((r,i)=>{const yy=14+i*rh,c=r.nps>=D.meta?'var(--good)':'var(--bad)',a0=Math.min(x(r.nps),x(D.meta)),w=Math.abs(x(r.nps)-x(D.meta));
    s+=`<text x="${L-8}" y="${yy+14}" text-anchor="end" style="fill:var(--ink);${r.k===st.praca?'font-weight:700':''}">${esc(r.k)}</text>
    <rect x="${a0}" y="${yy+4}" width="${Math.max(w,2)}" height="14" rx="3" fill="${c}"/>
    <text x="${r.nps>=D.meta?x(r.nps)+6:a0-6}" y="${yy+15}" text-anchor="${r.nps>=D.meta?'start':'end'}" style="fill:var(--ink);font-weight:600">${f1(r.nps)}</text>
    <rect x="0" y="${yy}" width="${W}" height="${rh}" fill="transparent" data-tip="${esc(r.k)}: NPS ${f1(r.nps)} · gap ${sg(r.gap)} p.p. · ${fi(r.n)} respostas · ${r.rev} detratores a reverter"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gap de NPS por praça em relação à meta">
    <line x1="${x(D.meta)}" x2="${x(D.meta)}" y1="6" y2="${H-14}" stroke="var(--ink2)" stroke-width="1.5"/>
    <text x="${x(D.meta)}" y="${H-2}" text-anchor="middle" style="font-weight:600">Meta 91</text>${s}</svg>`;
}
function motivosSVG(arr){
  const dn=arr.filter(r=>r[3]>0&&r[6]>0),pp=arr.filter(r=>r[3]===0&&r[6]>0);
  const pct=(a,k)=>a.length?a.filter(r=>(r[6]>>k)&1).length/a.length*100:0;
  const rows=MO.map((m,k)=>({m,d:pct(dn,k),p:pct(pp,k)})).sort((a,b)=>b.d-a.d);
  const W=640,L=250,Rr=44,rh=38,H=rows.length*rh+8,mx=Math.max(...rows.flatMap(r=>[r.d,r.p]),10),x=v=>L+(W-L-Rr)*v/mx;
  let s='';rows.forEach((r,i)=>{const yy=4+i*rh;
    s+=`<text x="${L-8}" y="${yy+22}" text-anchor="end" style="fill:var(--ink)">${esc(r.m.replace('/Custo-benefício',''))}</text>
    <rect x="${L}" y="${yy+5}" width="${Math.max(x(r.d)-L,1)}" height="12" rx="3" fill="var(--bad)"/><text x="${x(r.d)+5}" y="${yy+15}" style="fill:var(--ink);font-weight:600">${fi(r.d)}%</text>
    <rect x="${L}" y="${yy+20}" width="${Math.max(x(r.p)-L,1)}" height="12" rx="3" fill="var(--s2)"/><text x="${x(r.p)+5}" y="${yy+30}">${fi(r.p)}%</text>
    <rect x="0" y="${yy}" width="${W}" height="${rh}" fill="transparent" data-tip="${esc(r.m)}: ${f1(r.d)}% dos detratores/neutros e ${f1(r.p)}% dos promotores citaram"/>`});
  return {svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:760px;display:block" role="img" aria-label="Motivos citados por detratores e neutros versus promotores">${s}</svg>`,nd:dn.length,np:pp.length};
}
function themeBars(arr){
  const dn=arr.filter(r=>r[3]>0&&r[8]);
  const rows=TH.map((t,i)=>({t,i,c:dn.filter(r=>(r[5]>>i)&1).length})).sort((a,b)=>b.c-a.c);
  const mx=Math.max(1,...rows.map(r=>r.c));
  return {dn:dn.length,html:rows.map(r=>`<div class="bar"><span>${esc(r.t)}</span><span class="t"><i style="width:${r.c/mx*100}%"></i></span><b>${r.c}</b></div>`).join('')};
}

function viewResumo(){
  const a=sel(),m=agg(a);
  const sP=a.length?m.P/m.n*100:0,sN=a.length?m.N/m.n*100:0,sD=a.length?m.D/m.n*100:0;
  const stt=status(m,1);
  const kp=`<div class="kpis">
   <div class="kpi hero"><div class="l">NPS</div><div class="v ${m.gap<0?'neg':'pos'}">${f1(m.nps)}</div><div class="d">Meta ${D.meta} · <b class="${m.gap<0?'neg':'pos'}">${sg(m.gap)} p.p.</b></div></div>
   <div class="kpi"><div class="l">Respostas</div><div class="v">${fi(m.n)}</div><div class="d">${fi(m.P)} prom. · ${fi(m.N)} neut. · ${fi(m.D)} detr.</div></div>
   <div class="kpi"><div class="l">% Promotores</div><div class="v">${f1(sP)}%</div><div class="d">Neutros ${f1(sN)}% · Detratores ${f1(sD)}%</div></div>
   <div class="kpi"><div class="l">Detratores a reverter</div><div class="v">${m.rev?fi(m.rev):'0'}</div><div class="d">${m.rev?`${f1(m.D?m.rev/m.D*100:0)}% dos ${fi(m.D)} detratores${m.rev>m.D?' (não basta)':''}`:'Meta atingida'}</div></div>
   <div class="kpi"><div class="l">Promotores novos p/ meta</div><div class="v">${m.need?fi(m.need):'0'}</div><div class="d">${m.need?'Respostas 9–10 adicionais':`Folga de ${fi(m.cush)} detratores`}</div></div>
  </div>`;
  const a2=sel({praca:true,gvo:true,loja:true,cons:true}),gp=groupBy(a2,r=>S[r[0]].praca),tot=agg(a2);
  const pr=[...gp.entries()].map(([k,v])=>({k,...met(v[0],v[1],v[2])}));
  const nd=pr.filter(p=>p.nps<D.meta).sort((p,q)=>q.need-p.need);
  const top2=nd.slice(0,2);
  const lj=[...groupBy(a,r=>r[0]).entries()].map(([k,v])=>({k,...met(v[0],v[1],v[2])})).filter(l=>l.n>=30&&l.nps<D.meta).sort((p,q)=>q.need-p.need).slice(0,8);
  const read=[
   `NPS de <b>${f1(m.nps)}</b> em ${fi(m.n)} respostas: <b class="${m.gap<0?'neg':'pos'}">${sg(m.gap)} p.p.</b> em relação à meta de 91.`,
   m.rev?`Para chegar a 91 sem novas respostas, é preciso transformar <b>${fi(m.rev)} detratores em promotores</b>${m.rev<=m.D?` (${f1(m.rev/m.D*100)}% dos detratores)`:''}. A outra via é captar <b>${fi(m.need)} respostas promotoras novas</b>; as duas se somam.`:`A meta está atingida, com folga para até ${fi(m.cush)} detratores novos.`,
   top2.length?`Os maiores gaps em volume estão em ${top2.map(p=>`<b>${esc(p.k)}</b> (${f1(p.nps)}; ${fi(p.need)} prom. novos)`).join(' e ')}${st.praca||st.gvo||st.loja>=0?' (comparativo entre praças, ignora o filtro de praça/gestor/loja)':''}.`:'',
   `Meta atingida por ${pr.filter(p=>p.nps>=D.meta).length} de ${pr.length} praças.`
  ].filter(Boolean);
  const how=`<details class="how"><summary>Como o NPS e o gap são calculados</summary>
   <p>NPS = % de promotores (notas 9 e 10) − % de detratores (notas 0 a 6). Neutros (7 e 8) entram no total, mas não somam nem subtraem. Exemplo: 100 respostas, 90 promotores e 5 detratores = 90% − 5% = 85.</p>
   <p><b>Gap</b> = NPS − 91, em pontos percentuais. <b>Detratores a reverter</b> = quantos detratores precisam virar promotores (cada troca soma 2 pontos ao saldo P−D). <code>⌈(0,91 × respostas − (P − D)) ÷ 2⌉</code>. <b>Promotores novos</b> = respostas 9–10 adicionais mantendo o restante: <code>⌈(0,91 × respostas − (P − D)) ÷ 0,09⌉</code>.</p>
   <p>Escopo: pesquisas pós-compra, que têm Data do pedido, vinculadas a uma loja do cadastro. O mês é o da <b>Data do pedido</b>, e não o da resposta. Canais: Loja, Clique e Retire e Espaço do Revendedor (o canal “Loja + Clique e Retire” é o padrão). Ficam fora as pesquisas de Loja sem compra (retirada de brinde, só olhando) e a pesquisa de Loja Digital/WhatsApp. O consultor vem da coluna “Nome do consultor de vendas”.</p></details>`;
  const mt=motivosSVG(a);
  const gc=groupBy(sel({canal:true}),r=>r[2]);
  const crow=[...[0,1,2].map(k=>{const v=gc.get(k);return v?{k:CANL[k],...met(v[0],v[1],v[2])}:null}).filter(Boolean)];
  const lc=[0,1].map(k=>gc.get(k)).filter(Boolean);
  if(lc.length>1)crow.splice(2,0,{k:'Loja + Clique e Retire',...met(lc[0][0]+lc[1][0],lc[0][1]+lc[1][1],lc[0][2]+lc[1][2])});
  const canalCard=`<div class="card"><h2>NPS por canal</h2><p class="sub">Mesmo recorte dos filtros de praça, gestor, loja e mês; ignora o filtro de canal.</p><div class="tw"><table><thead><tr><th class="tl">Canal</th><th>Respostas</th><th>Detr.</th><th>NPS</th><th>Gap</th><th>Detr. a reverter</th></tr></thead><tbody>${crow.map(c=>`<tr><td class="tl name">${esc(c.k)}</td><td>${fi(c.n)}</td><td>${fi(c.D)}</td><td><b>${f1(c.nps)}</b></td><td>${gapCell(c)}</td><td>${c.rev?fi(c.rev):'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  return `${kp}
  ${canalCard}
  <div class="grid2">
   <div class="card"><h2>Leitura do período</h2><p class="sub">${esc(stt[1])} · calculada com os filtros atuais</p><ul class="read">${read.map(x=>`<li>${x}</li>`).join('')}</ul><div style="margin-top:12px">${how}</div></div>
   <div class="card"><h2>NPS por mês</h2><p class="sub">Linha vermelha tracejada = meta. Respeita canal, praça, gestor e loja.</p>${trendSVG()}</div>
  </div>
  <div class="grid2">
   <div class="card"><h2>Praças contra a meta</h2><p class="sub">Barra parte da meta (91). Vermelho = abaixo, verde = acima. Clique no nome em “Praças” para detalhar.</p>${pracaBarsSVG()}</div>
   <div class="card"><h2>Onde estão os maiores gaps de loja</h2><p class="sub">Lojas com 30+ respostas, ordenadas por promotores novos necessários.</p>
     ${lj.length?`<div class="tw"><table><thead><tr><th class="tl">Loja</th><th>NPS</th><th>Gap</th><th>Detr. a reverter</th></tr></thead><tbody>${lj.map(l=>`<tr class="click" data-loja="${l.k}" tabindex="0"><td class="tl name">${esc(S[l.k].loja)}<span class="sm">${esc(S[l.k].praca)} · ${esc(S[l.k].gvo)}</span></td><td><b>${f1(l.nps)}</b></td><td>${gapCell(l)}</td><td>${fi(l.rev)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Nenhuma loja abaixo da meta neste recorte.</p>'}
   </div>
  </div>
  <div class="card"><h2>Por que as notas caem</h2><p class="sub">% de detratores/neutros (${fi(mt.nd)} com motivo) e de promotores (${fi(mt.np)}) que marcaram cada motivo na pesquisa. Motivo com barra vermelha maior que a azul é ponto de atrito. Barra azul bem maior que a vermelha mostra o que sustenta a nota alta.</p>${mt.svg}
   <div class="legend"><span><i style="background:var(--bad)"></i>Detratores e neutros</span><span><i style="background:var(--s2)"></i>Promotores</span></div></div>`;
}
function entityTable(kind){
  const a=sel();
  let keyf,cols,minN=30,handler,id=kind;
  const mk=(g,extra)=>[...g.entries()].map(([k,v])=>({id:k,...met(v[0],v[1],v[2]),...extra(k)}));
  let rows;
  if(kind==='pracas'){
    rows=mk(groupBy(a,r=>S[r[0]].praca),k=>({name:k,gv:new Set(S.filter(s=>s.praca===k).map(s=>s.gvo)).size,lj:S.filter(s=>s.praca===k).length}));
    cols=[{k:'name',h:'Praça',l:1},{k:'gv',h:'Gestores'},{k:'lj',h:'Lojas'},...baseCols(minN)];
    handler=k=>{st.praca=k;st.gvo='';st.loja=-1;st.cons=-1;st.tab='gestores';render(true)};
  }else if(kind==='gestores'){
    rows=mk(groupBy(a,r=>S[r[0]].gvo),k=>{const ss=S.filter(s=>s.gvo===k);return {name:k,pr:[...new Set(ss.map(s=>s.praca))].join(' / '),lj:ss.length}});
    cols=[{k:'name',h:'Gestor',l:1},{k:'pr',h:'Praça',l:1},{k:'lj',h:'Lojas'},...baseCols(minN)];
    handler=k=>{st.gvo=k;st.loja=-1;st.cons=-1;st.tab='lojas';render(true)};
  }else{
    rows=mk(groupBy(a,r=>r[0]),k=>({name:S[k].loja,pr:S[k].praca,gv:S[k].gvo}));
    cols=[{k:'name',h:'Loja',l:1},{k:'pr',h:'Praça',l:1},{k:'gv',h:'Gestor',l:1},...baseCols(minN)];
    handler=k=>{st.loja=+k;st.cons=-1;st.tab='consultores';render(true)};
  }
  decorate(rows,minN);
  const lead={pracas:'Clique em uma praça para ver seus gestores.',gestores:'Clique em um gestor para ver suas lojas.',lojas:'Clique em uma loja para ver seus consultores.'}[kind];
  return {html:`<div class="card"><h2>${{pracas:'Praças',gestores:'Gestores',lojas:'Lojas'}[kind]}</h2><p class="sub">${lead} Ordene clicando no cabeçalho. Ordem inicial: maior necessidade de promotores primeiro.</p>
    ${tools(id,`<span class="note">${rows.length} linhas · amostra baixa = menos de ${minN} respostas</span>`)}${tableHTML(id,cols,rows,true)}</div>`,id,handler};
}
function viewConsultores(){
  const a=sel().filter(r=>r[4]>=0);
  const semC=sel().filter(r=>r[2]===0&&r[4]<0).length;
  const lojaM=new Map([...groupBy(sel({cons:true}),r=>r[0]).entries()].map(([k,v])=>[k,met(v[0],v[1],v[2])]));
  const g=new Map();
  for(const r of a){let o=g.get(r[4]);if(!o){o={c:[0,0,0],lj:new Map()};g.set(r[4],o)}o.c[r[3]]++;o.lj.set(r[0],(o.lj.get(r[0])||0)+1)}
  const minN=10;
  let rows=[...g.entries()].map(([k,o])=>{
    const lj=[...o.lj.entries()].sort((x,y)=>y[1]-x[1]),main=lj[0][0],lm=lojaM.get(main);
    return {id:k,...met(o.c[0],o.c[1],o.c[2]),name:C[k],loja:S[main].loja+(lj.length>1?` +${lj.length-1}`:''),lgap:lm?lm.gap:0,lnps:lm?lm.nps:0};
  });
  const tot=rows.length;
  if(st.onlyN)rows=rows.filter(r=>r.n>=minN);
  decorate(rows,minN);
  const cols=[{k:'name',h:'Consultor',l:1},{k:'loja',h:'Loja principal',l:1},...baseCols(minN).slice(0,7),
    {k:'lgap',h:'Gap da loja',f:r=>`<span class="${r.lgap<0?'neg':'pos'}">${sg(r.lgap)}</span>`,tip:'Gap de NPS da loja principal do consultor, no mesmo recorte'},
    baseCols(minN)[8]];
  const ex=`<label class="note"><input type="checkbox" id="onlyN" ${st.onlyN?'checked':''}> Ocultar consultores com menos de ${minN} respostas (${rows.length} de ${tot} aparecem)</label>`;
  return `<div class="card"><h2>Consultores</h2><p class="sub">Pesquisas de Loja com consultor identificado, que existem só no canal Loja${semC?` (${fi(semC)} respostas de Loja sem consultor na base ficam fora desta aba)`:''}. Quem atende em mais de uma loja aparece uma vez, somando as respostas, com “+N” na loja principal. Clique na linha para ler os comentários.</p>
   ${tools('consultores',ex)}${tableHTML('consultores',cols,rows,true)}</div>`;
}
function viewComentarios(){
  const a=sel();
  const mt=motivosSVG(a),tb=themeBars(a);
  const g=groupBy(sel({praca:true,gvo:true,loja:true,cons:true}),r=>S[r[0]].praca);
  const all=sel({praca:true,gvo:true,loja:true,cons:true});
  const cards=[...g.keys()].map(k=>{
    const ar=all.filter(r=>S[r[0]].praca===k),m=agg(ar),dn=ar.filter(r=>r[3]>0),dm=dn.filter(r=>r[6]>0),dc=dn.filter(r=>r[8]);
    const mo=MO.map((x,i)=>({x,p:dm.length?dm.filter(r=>(r[6]>>i)&1).length/dm.length*100:0})).sort((p,q)=>q.p-p.p).slice(0,3);
    const th=TH.map((x,i)=>({x,c:dc.filter(r=>(r[5]>>i)&1).length})).filter(t=>t.c>0).sort((p,q)=>q.c-p.c).slice(0,3);
    const s=status(m,30);
    return {k,m,html:`<div class="pc"><header><h3>${esc(k)}</h3><span class="pill ${s[0]}">${f1(m.nps)} · ${sg(m.gap)} p.p.</span></header>
     <div class="note">${fi(m.n)} respostas · ${fi(m.D)} detratores · ${fi(m.N)} neutros · ${dc.length} com comentário</div>
     <div><b style="font-size:12px">Motivos mais marcados (det./neutros)</b>${mo.map(o=>`<div class="bar"><span>${esc(o.x.replace('/Custo-benefício',''))}</span><span class="t"><i style="width:${o.p}%"></i></span><b>${fi(o.p)}%</b></div>`).join('')}</div>
     <div><b style="font-size:12px">Temas nos comentários</b>${th.length?th.map(o=>`<div class="bar"><span>${esc(o.x)}</span><span class="t"><i style="width:${o.c/th[0].c*100}%"></i></span><b>${o.c}</b></div>`).join(''):'<div class="note">Poucos comentários para classificar.</div>'}</div>
     ${NARR[k]?`<p style="margin:0;font-size:13px;color:var(--ink2)">${NARR[k]}</p>`:''}</div>`};
  }).sort((p,q)=>p.m.nps-q.m.nps);
  let cm=a.filter(r=>r[3]>0&&r[8]);
  if(st.cmType!=='all')cm=cm.filter(r=>r[3]===+st.cmType);
  if(st.cmTheme>=0)cm=cm.filter(r=>(r[5]>>st.cmTheme)&1);
  if(st.q){const q=st.q.toLowerCase();cm=cm.filter(r=>r[8].toLowerCase().includes(q))}
  cm.sort((x,y)=>x[7]-y[7]);
  const shown=cm.slice(0,st.cmShow);
  const list=shown.map(r=>{const s=S[r[0]],c=r[7]<=6?'p-bad':'p-warn';
    return `<div class="cm"><div class="h"><span class="nota pill ${c}">${r[7]}</span><b style="color:var(--ink)">${esc(s.loja)}</b><span>${esc(s.praca)}</span><span class="tag">${CANL[r[2]]}</span>${r[4]>=0?`<span class="tag">Consultor: ${esc(C[r[4]])}</span>`:''}<span>${ml(M[r[1]])}</span>${TH.map((t,i)=>(r[5]>>i)&1?`<span class="tag">${esc(t)}</span>`:'').join('')}</div><p>${esc(r[8])}</p></div>`}).join('');
  return `<div class="card"><h2>Insights por praça</h2><p class="sub">Motivos marcados e temas dos comentários de detratores e neutros no período/canal selecionados (ignora o filtro de praça para permitir comparar). A leitura em texto vale para o acumulado jan–out/2026.</p><div class="cards">${cards.map(c=>c.html).join('')}</div></div>
  <div class="grid2">
   <div class="card"><h2>Motivos: detratores/neutros vs promotores</h2><p class="sub">Recorte atual do painel.</p>${mt.svg}<div class="legend"><span><i style="background:var(--bad)"></i>Detratores e neutros (${fi(mt.nd)})</span><span><i style="background:var(--s2)"></i>Promotores (${fi(mt.np)})</span></div></div>
   <div class="card"><h2>Temas nos comentários de detratores e neutros</h2><p class="sub">${fi(tb.dn)} comentários. Classificação automática por palavras-chave; um comentário pode ter mais de um tema.</p><div style="display:grid;gap:7px">${tb.html}</div></div>
  </div>
  <div class="card"><h2>Comentários para tratar</h2><p class="sub">Notas 0 a 8 com texto, da pior para a melhor. Filtre por loja, consultor ou praça nos filtros do topo.</p>
   <div class="tools"><div class="l">
     <div class="seg" id="cmType" role="group" aria-label="Tipo"><button data-v="all" aria-pressed="${st.cmType==='all'}">Todos</button><button data-v="2" aria-pressed="${st.cmType==='2'}">Detratores</button><button data-v="1" aria-pressed="${st.cmType==='1'}">Neutros</button></div>
     <select id="cmTheme" aria-label="Tema"><option value="-1">Todos os temas</option>${TH.map((t,i)=>`<option value="${i}" ${st.cmTheme===i?'selected':''}>${esc(t)}</option>`).join('')}</select>
     <input type="search" id="cmQ" placeholder="Buscar no texto" value="${esc(st.q)}" aria-label="Buscar no texto"></div>
     <span class="note">${fi(cm.length)} comentários</span></div>
   <div>${list||'<p class="note">Nenhum comentário para os filtros atuais.</p>'}</div>
   ${cm.length>shown.length?`<p><button class="btn" id="cmMore">Mostrar mais ${Math.min(40,cm.length-shown.length)}</button></p>`:''}</div>`;
}

/* ---------- render ---------- */
let tblHandler=null;
function render(refill){
  if(refill){fillSelects();fillMeses()}
  $('tabs').innerHTML=TABS.map(([k,t])=>`<button role="tab" data-t="${k}" aria-selected="${st.tab===k}">${t}</button>`).join('');
  crumbs();
  const v=$('view');let h='',id=null,handler=null;
  const focusQ=document.activeElement&&document.activeElement.id==='cmQ';
  if(st.tab==='resumo')h=viewResumo();
  else if(st.tab==='consultores'){h=viewConsultores();id='consultores';handler=k=>{st.cons=+k;st.tab='comentarios';render(true)}}
  else if(st.tab==='comentarios')h=viewComentarios();
  else{const e=entityTable(st.tab);h=e.html;id=e.id;handler=e.handler}
  v.innerHTML=h;
  if(id){bindTable(id,handler);const b=$('btnCopy');if(b)b.onclick=()=>copyTable(id)}
  if(st.tab==='resumo'){v.querySelectorAll('tr[data-loja]').forEach(tr=>{const go=()=>{st.loja=+tr.dataset.loja;st.tab='consultores';render(true)};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}})}
  const oc=$('onlyN');if(oc)oc.onchange=e=>{st.onlyN=e.target.checked;render()};
  if(st.tab==='comentarios'){
    $('cmType').onclick=e=>{const b=e.target.closest('button');if(b){st.cmType=b.dataset.v;st.cmShow=40;render()}};
    $('cmTheme').onchange=e=>{st.cmTheme=+e.target.value;st.cmShow=40;render()};
    $('cmQ').oninput=e=>{st.q=e.target.value;st.cmShow=40;render();const q=$('cmQ');q.focus();q.setSelectionRange(q.value.length,q.value.length)};
    const mo=$('cmMore');if(mo)mo.onclick=()=>{st.cmShow+=40;render()};
  }
  const n=agg(sel());
  $('subtitle').textContent=`Pesquisa pós-compra por mês do pedido, de ${ml(M[0])} a ${ml(M[M.length-1])}; respostas recebidas até 09/10/2026. Recorte atual: ${fi(n.n)} respostas.`;
}
$('foot').textContent=`Fontes: ExpressReport (pesquisa NPS, ${fi(R.length)} respostas pós-compra) e dcentros (loja, praça, gestor). Mês = Data do pedido. Ficam fora: ${fi(D.semped)} pesquisas de Loja sem pedido (sem compra), ${D.semcad} respostas da loja 023778 (não consta no dcentros) e a pesquisa de Loja Digital/WhatsApp. Meta ${D.meta}%. Pedidos recentes podem receber respostas depois desta extração.`;
fillSelects();fillMeses();bindFilters();render();
</script>
</body></html>
